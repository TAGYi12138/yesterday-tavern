<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>昨日酒馆 · 观察器</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e6e6;
          --muted:#8a93a6; --me:#1f6feb; --accent:#e2b714; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--text);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header .sp { flex:1; }
  select, label { font-size:13px; color:var(--text); }
  select { background:#0d0f13; color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:4px 8px; }
  .toggle { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#222; color:var(--muted); }
  main { flex:1; display:grid; grid-template-columns:220px 1fr 280px; min-height:0; }
  .col { overflow-y:auto; padding:12px; }
  #left { border-right:1px solid var(--line); }
  #right { border-left:1px solid var(--line); }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
            color:var(--muted); margin:0 0 10px; }
  .npc { padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:#12151c; }
  .npc .nm { font-weight:600; }
  .npc .meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:9px; margin-right:5px; }
  .tag.active{background:#173a2a;color:#5fd39a;} .tag.away,.tag.hiding{background:#3a2a17;color:#e2b714;}
  .tag.absent{background:#3a1f22;color:#f08a8a;}
  .tag.ms{background:#2a1f3a;color:#c69af0;}
  .msg { margin:6px 0; max-width:80%; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .msg .bub { display:inline-block; padding:7px 11px; border-radius:10px; background:#1b1f29; white-space:pre-wrap; line-height:1.5; }
  .msg.dialogue.right { margin-left:auto; text-align:right; }
  .msg.dialogue.right .bub { background:var(--me); color:#fff; }
  .msg.narration { text-align:center; max-width:100%; }
  .msg.narration .bub { background:transparent; color:var(--muted); font-style:italic; font-size:13px; }
  .msg.system .bub { background:#2a2410; color:var(--accent); font-size:13px; }
  .msg.crisis .bub { background:#3a1515; color:#ff9b9b; }
  /* 多人讨论:把同一 group_id 的消息裹成一个群聊块。 */
  .groupblock { border:1px solid #33405e; border-radius:12px; margin:12px 0; padding:8px 10px 10px;
                background:linear-gradient(180deg,#141a26,#12151c); }
  .groupblock > .ghead { font-size:12px; color:#9ab0e0; margin:2px 2px 8px; display:flex; gap:8px; align-items:center; }
  .groupblock > .ghead .gtag { background:#1d2740; color:#9ab0e0; border-radius:9px; padding:1px 8px; font-size:11px; }
  .groupblock .msg { max-width:100%; }
  .daysep { text-align:center; color:var(--muted); font-size:12px; margin:14px 0 6px; }
  .daysep span { background:#0d0f13; padding:2px 12px; border:1px solid var(--line); border-radius:12px; }
  .dbg { font-size:11px; color:#6f7686; margin-top:4px; font-family:monospace; }
  #world .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  #world .row .k { color:var(--muted); }
  #world .feel { background:#12151c; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; line-height:1.6; }
  footer { padding:8px 12px; background:var(--panel); border-top:1px solid var(--line); }
  footer input { width:100%; background:#0d0f13; border:1px solid var(--line); color:var(--muted);
                 border-radius:8px; padding:8px 10px; }
</style>
</head>
<body>
<header>
  <h1>昨日酒馆 · 观察器</h1>
  <label>存档 <select id="game"></select></label>
  <span class="sp"></span>
  <span id="conn" class="badge">未连接</span>
  <label class="toggle"><input type="checkbox" id="mode" /> Debug 模式</label>
</header>
<main>
  <section id="left" class="col">
    <h2>角色 / 状态</h2>
    <div id="npcs"></div>
  </section>
  <section id="center" class="col">
    <h2>实时群聊</h2>
    <div id="stream"></div>
  </section>
  <section id="right" class="col">
    <h2>世界状态</h2>
    <div id="world"></div>
  </section>
</main>
<footer>
  <input type="text" placeholder="玩家输入（暂未开放——第一版仅做只读观察器）" disabled />
</footer>
<script src="/app.js"></script>
</body>
</html>
